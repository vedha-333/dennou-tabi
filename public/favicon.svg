<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="hankoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF4E8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F2E6CE" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Seal Background with soft rounded rectangle -->
  <rect width="128" height="128" rx="26" fill="url(#hankoGlow)"/>
  
  <!-- Outer Vermilion Hanko Stamp Border -->
  <rect x="7" y="7" width="114" height="114" rx="20" fill="none" stroke="#B84C3D" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Inner Delicate Accent Inset -->
  <rect x="15" y="15" width="98" height="98" rx="14" fill="#B84C3D" fill-opacity="0.07"/>
  
  <!-- Japanese Character in Vermilion: 旅 (Tabi - Journey from dennou-tabi) -->
  <text x="64" y="93" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', 'Georgia', serif" font-size="78" font-weight="900" fill="#B84C3D" text-anchor="middle" letter-spacing="-0.02em">旅</text>
</svg>